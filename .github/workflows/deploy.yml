name: Deploy to Digital Ocean

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /var/www/poppymusic || exit 1
          git pull origin main
          npm ci
          npm run build
          
          # Vérifier si l'app PM2 existe, sinon la créer
          if pm2 describe poppymusic > /dev/null 2>&1; then
            echo "Application PM2 trouvée, rechargement..."
            pm2 reload poppymusic
          else
            echo "Application PM2 non trouvée, création..."
            pm2 start npm --name "poppymusic" -- run preview
            pm2 save
          fi
          
          # Vérifier le statut
          pm2 status poppymusic
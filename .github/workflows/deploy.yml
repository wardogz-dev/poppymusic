name: 🚀 Deploy Poppy Music

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 Install dependencies
      run: npm ci
      
    - name: 🏗️ Build project
      run: npm run build
      
    - name: 🚀 Deploy via webhook
      run: |
        echo "🔗 Déclenchement du webhook de déploiement..."
        curl -f -X GET "https://poppymusic.fr/webhook-deploy.php?secret=poppymusic2025" || echo "❌ Webhook échoué"
        
    - name: ✅ Deployment complete
      run: |
        echo "✅ Déploiement terminé !"
        echo "🌐 Site accessible : https://poppymusic.fr"
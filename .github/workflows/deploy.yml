name: Deploy to Digital Ocean

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /var/www/poppymusic || exit 1
          git pull origin main
          npm ci
          npm run build
          
          # Plus besoin de PM2 - site statique servi par Nginx
          echo "✅ Build terminé - Site statique généré dans dist/"
          echo "📁 Contenu du répertoire dist :"
          ls -la dist/
          
          # Test que Nginx sert bien les fichiers
          echo "🧪 Test du site local :"
          curl -I http://localhost/ || echo "⚠️ Test local échoué"